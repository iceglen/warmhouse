databaseChangeLog:
  - changeSet:
      id: create-device-table
      author: artem
      changes:
        - createTable:
            tableName: device_entity
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: type
                  type: varchar(255)
              - column:
                  name: location
                  type: varchar(255)
              - column:
                  name: device_status
                  type: varchar(50)
              - column:
                  name: last_updated
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
        - createSequence:
            sequenceName: device_entity_seq