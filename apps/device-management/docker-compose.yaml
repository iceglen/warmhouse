services:

  postgres:
    container_name: smarthome-postgres
    image: postgres:17.6
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./smarthome-init.sql:/docker-entrypoint-initdb.d/smarthome-init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: metrics
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - smarthome-network

  rabbitmq:
    container_name: smarthome-rabbitmq
    image: rabbitmq:4.1-management
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smarthome-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  temperature-api:
    container_name: temperature-api-service
    image: localhost/temperature:latest
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  smarthome-app:
    image: localhost/smarthome-app:latest
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@smarthome-postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api-service:8081
    ports:
      - "8080:8080"
    restart: always
    networks:
      - smarthome-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: management-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
    ports:
      - "8083:8080"
    restart: always
    networks:
      - smarthome-network
networks:
  smarthome-network:

volumes:
  postgres_data: