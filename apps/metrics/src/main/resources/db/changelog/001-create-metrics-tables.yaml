databaseChangeLog:
  - changeSet:
      id: 001-create-metrics-table
      author: artem
      changes:
        - createTable:
            tableName: metrics
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-metric-units-table
      author: artem
      changes:
        - createTable:
            tableName: metric_units
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: metric_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_metric_unit_metric
                    references: metrics(id)
              - column:
                  name: metric_value
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false